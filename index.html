<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="doc.title">Storytime Near Me</title>
<style>:root{color-scheme:light dark}html,body{margin:0}img{max-width:100%}</style>
</head>
<body>
<style>
  :root{
    --paper:#FBFAF9; --card:#FFFFFF; --ink:#22262E; --muted:#5F6773; --faint:#8A929E;
    --line:#E7E3DC; --line-strong:#D8D3C9; --accent:#E8654F; --accent-ink:#B23f2c;
    --chip-bg:#F2EFEA; --shadow:0 1px 2px rgba(30,25,20,.05),0 6px 18px rgba(30,25,20,.06);
    --good:#3f9a5c; --warn-bg:#FBEFD8; --warn-ink:#8a5a12;
    --wknd:#E8654F; --wkdy:#3E88C7;
    /* Scheme 1 (Sunrise): age carries amber, language carries teal — filter chip → card pill. */
    --age-bg:#FAEEDA; --age-ink:#854F0B; --lang-bg:#E1F5EE; --lang-ink:#0F6E56;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#14161C; --card:#1D2026; --ink:#ECEAE4; --muted:#A2ABB8; --faint:#727C89;
      --line:#2B2F38; --line-strong:#3A3F4A; --accent:#F27C67; --accent-ink:#F9A794;
      --chip-bg:#262A32; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.35);
      --warn-bg:#38301C; --warn-ink:#E8C583;
      --age-bg:#3A2E16; --age-ink:#FAC775; --lang-bg:#123A30; --lang-ink:#5DCAA5;
    }
  }
  :root[data-theme="dark"]{
    --paper:#14161C; --card:#1D2026; --ink:#ECEAE4; --muted:#A2ABB8; --faint:#727C89;
    --line:#2B2F38; --line-strong:#3A3F4A; --accent:#F27C67; --accent-ink:#F9A794;
    --chip-bg:#262A32; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.35);
    --warn-bg:#38301C; --warn-ink:#E8C583;
  }

  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--paper); color:var(--ink);
    font:400 16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:0 20px 80px}
  h1,h2,h3{font-family:Georgia,"Iowan Old Style","Times New Roman",serif;font-weight:600;letter-spacing:-.01em}
  a{color:var(--accent-ink);text-decoration:none}
  a:hover{text-decoration:underline}
  button{font-family:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

  /* header */
  header{padding:34px 0 18px}
  .eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-ink);font-weight:600}
  h1{font-size:clamp(30px,5vw,44px);margin:.24em 0 .12em;text-wrap:balance;line-height:1.05}
  .lede{color:var(--muted);max-width:60ch;font-size:16.5px}
  .lede b{color:var(--ink);font-weight:600}
  .eyebrowrow{display:flex;align-items:center;justify-content:space-between;gap:10px 14px;flex-wrap:wrap}
  .langtoggle{display:inline-flex;gap:2px;background:var(--chip-bg);padding:3px;border-radius:10px;flex:0 0 auto}
  .langtoggle button{border:0;background:transparent;color:var(--muted);font-weight:700;font-size:12px;letter-spacing:.04em;padding:5px 11px;border-radius:7px;cursor:pointer}
  .langtoggle button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}

  /* controls */
  .panel{
    position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 78%,transparent);
    backdrop-filter:blur(10px);border-bottom:1px solid var(--line);margin:0 -20px 22px;padding:12px 20px;
  }
  .controls{display:flex;flex-wrap:wrap;gap:14px 18px;align-items:flex-end}
  .controls.locked{opacity:.5;pointer-events:none}  /* inert while locating */
  .filterbar{display:none}  /* mobile-only trigger; desktop shows controls inline */
  .field{display:flex;flex-direction:column;gap:5px}
  .field label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600}
  .field input[type=text],.field input[type=number]{
    width:88px;padding:7px 9px;border:1px solid var(--line-strong);border-radius:9px;background:var(--card);color:var(--ink);font-size:15px;
  }
  .field .val{font-variant-numeric:tabular-nums}
  input[type=range]{width:130px;accent-color:var(--accent);margin:0}
  /* Match the ZIP input's height (33px) and center the slider, so the Distance field is the
     same height as the Zip field — labels line up and the slider sits at the input's center. */
  .rangewrap{display:flex;align-items:center;gap:9px;min-height:33px}
  .rangewrap .val{font-size:13px;color:var(--muted);min-width:58px}
  .checks{display:flex;flex-wrap:wrap;gap:6px}
  .chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted);
       border:1px solid var(--line-strong);background:var(--card);border-radius:20px;padding:5px 11px;cursor:pointer;user-select:none}
  .chk input{position:absolute;opacity:0;width:0;height:0}
  .chk.on{color:#fff;border-color:transparent}
  .chk .dot{width:9px;height:9px;border-radius:50%}
  .chk.on .dot{display:none}  /* fill already shows state; drop the dot so the label centers */
  /* Neutral chips (day/time): no category color — selected = ink/paper swap, works both themes. */
  .chk.neu .dot{display:none}
  .chk.on.neu{background:var(--ink);color:var(--paper);border-color:transparent}
  #dowChecks .chk{min-width:42px;min-height:40px;justify-content:center}
  /* Day-of-week header: label on the left, an adaptive link — "Select all" when nothing is
     picked, "Clear" once one or more days are on */
  .dowhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .dowall{border:0;background:none;padding:0;cursor:pointer;font-size:11px;font-weight:700;
    letter-spacing:.04em;text-transform:uppercase;color:var(--accent-ink)}
  .dowall:hover{text-decoration:underline}

  /* tabs + summary */
  /* Pinned below the (sticky) filter panel so the view switcher stays in reach while
     scrolling; --panelH is kept in sync with the panel's height by syncStickyHeights(). */
  .bar{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin:2px 0 20px;
    position:sticky;top:var(--panelH,64px);z-index:15;
    background:color-mix(in srgb,var(--paper) 82%,transparent);backdrop-filter:blur(10px)}
  .tabs{display:inline-flex;gap:4px;background:var(--chip-bg);padding:4px;border-radius:12px}
  .tabs button{border:0;background:transparent;color:var(--muted);font-weight:600;font-size:14px;padding:8px 15px;border-radius:9px;cursor:pointer}
  .tabs button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
  .summary{font-size:14px;color:var(--muted)}
  .summary b{color:var(--ink);font-variant-numeric:tabular-nums}

  /* date group */
  .dategroup{margin:0 0 30px}
  .datehead{display:flex;align-items:baseline;gap:10px;position:sticky;top:var(--headH,156px);z-index:5;
            background:color-mix(in srgb,var(--paper) 90%,transparent);padding:6px 0;margin-bottom:6px}
  .datehead h2{font-size:19px;margin:0}
  .datehead .dow{color:var(--accent-ink);font-family:Georgia,serif;font-style:italic}
  .datehead .cnt{font-size:12px;color:var(--faint);font-weight:600;letter-spacing:.04em;text-transform:uppercase}

  /* event card */
  .ev{position:relative;display:grid;grid-template-columns:76px 1fr;gap:16px;align-items:start;
      background:var(--card);border:1px solid var(--line);border-left-width:5px;border-radius:12px;
      padding:14px 16px 14px 15px;margin-bottom:12px;box-shadow:var(--shadow)}
  .ev .time{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;letter-spacing:.01em}
  .ev .time small{display:block;font-weight:500;color:var(--faint);font-size:12px}
  .ev .body h3{font-size:17px;margin:0 0 4px;padding-right:36px}
  .ev .body h3 a{color:inherit;text-decoration:underline;text-decoration-color:var(--line-strong);text-decoration-thickness:1px;text-underline-offset:2px}
  .ev .body h3 a:hover{color:var(--accent-ink);text-decoration-color:var(--accent)}
  /* Two rows: library + distance on top, language/age pills below. Gap matches the By-date
     view's .bmeta margin-top (11px) so the three views feel consistent. */
  .ev .meta{display:flex;flex-direction:column;gap:11px;font-size:13px;color:var(--muted)}
  .ev .metatop{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
  .ev .metapills{display:flex;flex-wrap:wrap;align-items:center;gap:5px}
  .ev a.loc{font-weight:600;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line-strong);text-decoration-thickness:1px;text-underline-offset:2px}
  .ev a.loc:hover{color:var(--accent-ink);text-decoration-color:var(--accent)}
  .ev span.loc{font-weight:600;color:var(--ink)}
  .tag{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--chip-bg);color:var(--muted);letter-spacing:.02em}
  .tag.lang{background:var(--lang-bg);color:var(--lang-ink)}
  .tag.age{background:var(--age-bg);color:var(--age-ink)}
  .calbtn{width:32px;height:32px;flex:none;
       display:inline-flex;align-items:center;justify-content:center;
       border:1px solid var(--line-strong);border-radius:9px;background:var(--card);color:var(--accent-ink)}
  .calbtn svg{width:17px;height:17px}
  .calbtn:hover{border-color:var(--accent);color:var(--accent);text-decoration:none}
  /* In the card views the calendar button floats top-right; in By-location rows it sits inline. */
  .ev .calbtn,.block .calbtn{position:absolute;top:11px;right:11px}
  /* Reusable distance pill (pin + miles), shared across all three views. */
  .distpill{flex:none;display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;
       color:var(--ink);background:var(--chip-bg);border-radius:999px;padding:3px 9px}
  .distpill svg{width:1em;height:1em;flex:none}
  .distpill .pin{display:inline-flex}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px;font-weight:600;
       padding:7px 11px;border-radius:9px;border:1px solid var(--line-strong);background:var(--card);color:var(--ink);cursor:pointer;white-space:nowrap;text-align:center}
  .btn:hover{border-color:var(--accent);text-decoration:none;color:var(--accent-ink)}
  .btn.gcal{background:var(--accent);color:#fff;border-color:transparent}
  .btn.gcal:hover{color:#fff;filter:brightness(1.05)}

  /* location view */
  .loccard{background:var(--card);border:1px solid var(--line);border-left-width:6px;border-radius:14px;padding:18px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
  .loccard .ic{width:1em;height:1em;flex:none}
  /* header row: identity (dot + linked name) on the left, distance pill on the right */
  .loccard .lhead{display:flex;gap:12px;align-items:center;justify-content:space-between}
  /* Dot aligns to the first line (flex-start + margin) so the name can wrap to 2 lines
     instead of truncating with an ellipsis on narrow screens. */
  .loccard h2{font-size:20px;font-weight:800;letter-spacing:-.01em;margin:0;min-width:0;display:flex;align-items:flex-start;gap:9px}
  .loccard h2 .dot{width:12px;height:12px;border-radius:50%;flex:none;margin-top:6px}
  .loccard h2 a{color:inherit;text-decoration:none;display:inline-flex;align-items:flex-start;gap:5px;min-width:0}
  .loccard h2 a .name{text-decoration:underline;text-decoration-color:var(--line-strong);text-decoration-thickness:1px;text-underline-offset:2px}
  .loccard h2 a:hover{color:var(--accent-ink)}
  .loccard h2 a:hover .name{text-decoration-color:var(--accent)}
  /* meta row: map + phone actions and the system tag, closed by a hairline that sets the header off from the event list */
  .loccard .meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-size:13px;margin:9px 0 0;padding-bottom:12px;border-bottom:1px solid var(--line)}
  .loccard .meta a{display:inline-flex;align-items:center;gap:5px;color:var(--accent-ink)}
  .loccard .meta a .ic{color:var(--accent)}
  .loccard .meta a:hover{text-decoration:underline}
  .loccard .meta .systag{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--faint)}
  .loccard .meta + .schedrow,.loccard .note + .schedrow{border-top:0}
  .note{display:flex;gap:8px;align-items:flex-start;background:var(--warn-bg);color:var(--warn-ink);border-radius:10px;padding:9px 12px;font-size:13px;font-weight:500;margin:12px 0 2px}
  .schedrow{display:grid;grid-template-columns:172px 1fr auto;gap:14px;align-items:center;padding:10px 2px;border-top:1px dashed var(--line)}
  .schedrow .d{font-weight:700;font-size:14px;white-space:nowrap}
  .schedrow .n{font-size:14.5px}
  .schedrow .n a{color:var(--ink);text-decoration:underline;text-decoration-color:var(--line-strong);text-decoration-thickness:1px;text-underline-offset:2px}
  .schedrow .n a:hover{color:var(--accent-ink);text-decoration-color:var(--accent)}
  .schedrow .n .sub{display:flex;flex-wrap:wrap;gap:5px;margin-top:11px}
  .morerows summary{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:7px 12px;
       font-size:13px;font-weight:600;color:var(--accent-ink);cursor:pointer;user-select:none;
       border:1px solid var(--line-strong);border-radius:20px;list-style:none;width:max-content}
  .morerows summary::-webkit-details-marker{display:none}
  .morerows summary::marker{content:""}
  .morerows summary:hover{border-color:var(--accent)}
  .morerows summary .less{display:none}
  .morerows[open] summary{margin-bottom:12px}
  .morerows[open] summary .more{display:none}
  .morerows[open] summary .less{display:inline}

  /* by-date view */
  .datesticky{position:sticky;top:var(--headH,156px);z-index:5;padding:6px 0 8px;margin-bottom:2px;
    background:color-mix(in srgb,var(--paper) 94%,transparent);backdrop-filter:blur(10px)}
  .datesticky h2{font-size:22px;margin:0}
  .datesticky .dcount{font-size:14px;color:var(--muted);margin:2px 0 0}
  .daynav{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;margin:0 -2px}
  .daychip{flex:0 0 auto;min-width:64px;text-align:center;border:1px solid var(--line-strong);background:var(--card);border-radius:12px;padding:9px 12px;cursor:pointer}
  .daychip.on{background:var(--ink);color:var(--paper);border-color:transparent}
  .daychip.on .dn{color:var(--paper)}
  .daychip .mo{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent-ink);font-weight:700}
  .daychip.on .mo{color:color-mix(in srgb,var(--paper) 80%,transparent)}
  .daychip .dw{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);font-weight:700}
  .daychip.on .dw{color:color-mix(in srgb,var(--paper) 75%,transparent)}
  .daychip .dn{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
  .daychip .cc{font-size:11px;color:var(--faint);font-weight:600}
  .daychip.on .cc{color:color-mix(in srgb,var(--paper) 70%,transparent)}
  .daychip.empty{opacity:.45}
  .dayblocks{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
  /* Light card + a thin library-color stripe (matches .loccard) — legible on any library
     color, unlike the old full-color fill with white text. --bcol carries the lib color. */
  .block{position:relative;background:var(--card);border:1px solid var(--line);
    border-left:5px solid var(--bcol,var(--accent));border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
  .block .bt{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;color:var(--ink)}
  .block .bt small{color:var(--muted);font-weight:600}
  .block h3{margin:3px 0 3px;font-size:17px;padding-right:38px}
  .block h3 a{color:var(--ink);text-decoration:underline;text-decoration-color:var(--line-strong);text-decoration-thickness:1px;text-underline-offset:2px}
  .block h3 a:hover{color:var(--accent-ink);text-decoration-color:var(--accent)}
  .block .bl{font-size:13px;font-weight:700;color:var(--ink);display:flex;flex-wrap:wrap;align-items:center;gap:7px}
  .block .bl a{color:var(--ink);text-decoration:underline;text-decoration-color:var(--line-strong);text-decoration-thickness:1px;text-underline-offset:2px}
  .block .bl a:hover{color:var(--accent-ink);text-decoration-color:var(--accent)}
  .block .bl .dot{width:9px;height:9px;border-radius:50%;background:var(--bcol,var(--accent));flex:none}
  .block .bl .mi{color:var(--muted);font-weight:600}
  .block .bmeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px;align-items:center}
  .block .btag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--chip-bg);color:var(--muted)}
  .block .btag.lang{background:var(--lang-bg);color:var(--lang-ink)}
  .block .btag.age{background:var(--age-bg);color:var(--age-ink)}
  .block .bbtn{margin-left:auto;display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;color:var(--accent-ink)}
  .block .bbtn svg{width:15px;height:15px}
  .block .bbtn:hover{color:var(--accent);text-decoration:none}

  .empty{text-align:center;padding:60px 20px;color:var(--muted)}
  .empty h2{font-size:22px;color:var(--ink);margin:0 0 6px}
  .spinner{width:40px;height:40px;margin:0 auto 16px;border-radius:50%;
    border:3px solid var(--line-strong);border-top-color:var(--accent);animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spinner{animation-duration:1.8s}}
  .empty code{background:var(--chip-bg);padding:1px 6px;border-radius:6px;font-size:13px}
  footer{margin-top:40px;padding-top:20px;border-top:1px solid var(--line);color:var(--faint);font-size:12.5px;line-height:1.6}
  footer .copyright{margin-top:10px;opacity:.8}
  footer a{color:var(--muted)}
  .hide{display:none!important}
  /* Back-to-top floating button */
  .totop{position:fixed;right:18px;bottom:18px;z-index:40;width:46px;height:46px;border:0;
    border-radius:50%;cursor:pointer;background:var(--accent);color:#fff;font-size:22px;line-height:1;
    box-shadow:0 4px 14px rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center;
    opacity:0;visibility:hidden;transform:translateY(8px);
    transition:opacity .2s ease,transform .2s ease,visibility .2s ease}
  .totop.show{opacity:1;visibility:visible;transform:none}
  .totop:hover{filter:brightness(1.06)}
  .totop:active{transform:scale(.94)}
  @media (max-width:640px){
    /* Collapsing the drawer removes height above the fold; without this the browser's
       scroll anchoring yanks scrollY down and can trip the re-open threshold (flip-flop). */
    html{overflow-anchor:none}
    header{padding:22px 0 12px}
    /* Weekday chips: one no-wrap row of 7 equal-width initials */
    .controls .field:has(#dowChecks){flex-basis:100%}
    #dowChecks{flex-wrap:nowrap;gap:5px}
    #dowChecks .chk{flex:1 1 0;min-width:0;min-height:44px;padding:0 2px;gap:0;font-size:14px}
    #dowChecks .chk .dot{display:none}
    /* Collapsible filter drawer: a slim sticky trigger, controls hidden until opened */
    .filterbar{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;
      padding:8px 2px;cursor:pointer;color:var(--ink);font-size:15px;font-weight:600}
    .filterbar .fspace{flex:1}
    .filterbar .fsum{font-size:12.5px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
    .filterbar .fchev{color:var(--muted);font-size:13px;transition:transform .2s ease}
    .panel.open .filterbar .fchev{transform:rotate(180deg)}
    .controls{display:none}
    .panel.open .controls{display:flex;margin-top:12px;padding-bottom:6px;
      max-height:calc(100dvh - 108px);overflow-y:auto}
    /* Event card: time reads inline (no cramped fixed column that wraps "11:30 am") */
    .ev{grid-template-columns:1fr;gap:6px;padding:14px 15px;margin-bottom:14px}
    /* Time reads inline (no cramped fixed column); the calendar button sits on this row,
       so it needs clearance — the title below it does not. */
    .ev .time{display:flex;align-items:baseline;gap:7px;font-size:14.5px;padding-right:38px}
    .ev .time small{display:inline;font-size:12.5px}
    .ev .time small::before{content:"·\00a0"}
    .ev .body h3{padding-right:0}
    .schedrow{grid-template-columns:1fr auto;row-gap:2px}
    .schedrow .calbtn{grid-column:2;grid-row:1/3}
    /* View tabs stick just under the whole (pinned) filter panel — expanded or collapsed —
       so both the filters and the tabs stay put. --panelH/--headH are kept in sync by JS. */
    .bar{position:sticky;top:var(--panelH,60px);z-index:15;margin:0 -20px 16px;padding:8px 20px;
      background:color-mix(in srgb,var(--paper) 82%,transparent);backdrop-filter:blur(10px);
      border-bottom:1px solid var(--line)}
    .bar .summary{display:none}
    .datehead,.datesticky{top:var(--headH,120px)}
    /* Solid (not translucent) on mobile so a card scrolling underneath doesn't ghost through
       the pinned date header. Desktop keeps its frosted look, where the overlap reads fine. */
    .datehead{background:var(--paper)}
    .datesticky{background:var(--paper);backdrop-filter:none}
  }
  @media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>

<div class="wrap">

// Look up a string for the active language. Values may be plain strings (with
// {placeholder} interpolation) or functions (for count/plural cases). Falls
// back to English, then to the key itself.
function t(key, vars){
  const table = STRINGS[state.lang] || STRINGS.en;
  let s = table[key];
  if(s == null) s = STRINGS.en[key];
  if(s == null) return key;
  if(typeof s === "function") return s(vars || {});
  if(vars) s = s.replace(/\{(\w+)\}/g, (_,k)=> (vars[k] != null ? vars[k] : ""));
  return s;
}

// Swap all static [data-i18n*] markup + the footer to the active language.
// Dynamic view content is retranslated on the next render().
function applyStaticI18n(){
  document.querySelectorAll("[data-i18n]").forEach(el=>{ el.textContent = t(el.dataset.i18n); });
  [["data-i18n-ph","placeholder"],["data-i18n-title","title"],["data-i18n-aria","aria-label"]]
    .forEach(([da,dom])=>document.querySelectorAll("["+da+"]").forEach(el=>el.setAttribute(dom, t(el.getAttribute(da)))));
  const f=document.getElementById("footer"); if(f) f.innerHTML=footerHtml();
}
// Weekday chips: two-letter glyph (unambiguous, unlike the old M/T/T/S/S) + title/aria
// localized via Intl (0=Sun..6=Sat).
function localizeDowChips(){
  document.querySelectorAll("#dowChecks .chk").forEach(el=>{
    const rd=new Date(2024,0,7 + (+el.dataset.dow));   // Jan 7 2024 = Sunday; +dow lands on the day
    const dl=el.querySelector(".dl"); if(dl) dl.textContent=wdTwo(rd);   // Mon→Mo, lun.→Lu (shared helper)
    const full=wdLong(rd);
    el.title=full;
    const inp=el.querySelector("input"); if(inp) inp.setAttribute("aria-label", full);
  });
}
function footerHtml(){
  const links=`<a href="https://sandiego.events.mylibrary.digital/" target="_blank" rel="noopener">${esc(t("footer.linkCity"))}</a>, `+
              `<a href="https://sdcl.bibliocommons.com/v2/events" target="_blank" rel="noopener">${esc(t("footer.linkCounty"))}</a>. `;
  return t("footer.body",{links})+`<div class="copyright">${esc(t("footer.copyright"))}</div>`;
}
// Resolve the initial language: ?lang= → localStorage → navigator → English.
function initialLang(){
  try{ const p=new URL(location.href).searchParams.get("lang"); if(p==="en"||p==="es") return p; }catch(e){}
  try{ const s=localStorage.getItem("stny.lang"); if(s==="en"||s==="es") return s; }catch(e){}
  const navs=navigator.languages||[navigator.language||""];
  return navs.some(l=>String(l).toLowerCase().startsWith("es")) ? "es" : "en";
}
// Switch UI language: persist, reflect in <html lang> + URL, retranslate, repaint.
function setLang(lang){
  state.lang = (lang==="es") ? "es" : "en";
  try{ localStorage.setItem("stny.lang", state.lang); }catch(e){}
  document.documentElement.lang = state.lang;
  try{ const u=new URL(location.href); u.searchParams.set("lang", state.lang); history.replaceState(null,"",u); }catch(e){}
  document.querySelectorAll(".langtoggle button").forEach(b=>
    b.setAttribute("aria-pressed", b.dataset.setlang===state.lang ? "true":"false"));
  applyStaticI18n();
  localizeDowChips();
  updateDowBtn();
  render();
  syncStickyHeights();
}

function haversine(a,b,c,d){
  const R=3958.8, toR=x=>x*Math.PI/180;
  const dLat=toR(c-a), dLng=toR(d-b);
  const s=Math.sin(dLat/2)**2 + Math.cos(toR(a))*Math.cos(toR(c))*Math.sin(dLng/2)**2;
  return R*2*Math.asin(Math.sqrt(s));
}
function origin(){ return ZIPS[state.zip] || ZIPS[SD_CENTROID_ZIP]; }
function libDist(l){ const o=origin(); return haversine(o[0],o[1],l.lat,l.lng); }

// Snap a lat/lng to the closest known San Diego ZIP centroid.
function nearestZip(lat,lng){
  let best=null, bestD=Infinity;
  for(const z in ZIPS){ const c=ZIPS[z], d=haversine(lat,lng,c[0],c[1]); if(d<bestD){ bestD=d; best=z; } }
  return {zip:best, dist:bestD};
}
function setZip(z){
  state.zip=z;
  const el=document.getElementById("zip"); if(el) el.value=z;
  render();
}
// Clear the "locating" hold once and repaint (events replace the spinner).
// Lock/unlock all filter controls (used to keep them inert while locating).
function setFiltersEnabled(on){
  const c=document.getElementById("controls"); if(!c) return;
  c.classList.toggle("locked", !on);
  c.querySelectorAll("input,button").forEach(el=>{ el.disabled=!on; });
}
function finishLocating(){
  if(!locating) return;
  locating=false;
  // Fill the (initially empty) ZIP box with the resolved ZIP — the default if geo didn't set one.
  const el=document.getElementById("zip"); if(el && !el.value) el.value=state.zip;
  setFiltersEnabled(true);   // filters become usable now that we know the location
  render();
}
// Try to center the search on the user's location; otherwise keep the SD centroid default.
function initLocation(){
  if(!navigator.geolocation){ finishLocating(); return; }
  navigator.geolocation.getCurrentPosition(
    pos=>{
      const {zip,dist}=nearestZip(pos.coords.latitude,pos.coords.longitude);
      // Only adopt it if they're actually in/near the county (every SD ZIP centroid is
      // within ~10 mi of another); otherwise stay centered on the city.
      if(zip && dist<=30) setZip(zip);
      finishLocating();
    },
    ()=>{ finishLocating(); },   // denied / unavailable / timeout — SD centroid default stands
    {enableHighAccuracy:false, timeout:8000, maximumAge:600000}
  );
  setTimeout(finishLocating, 9000);   // safety net in case no callback ever fires
}
function fmtTime(tm){
  const [h,m]=tm.split(":").map(Number);
  const d=new Date(2000,0,1,h,m);                     // any date; only h:m matter
  // Intl handles am/pm per locale (en "10:00 AM", es "10:00 a. m."); lowercase
  // to keep the app's existing "10:00 am" styling.
  return dtf({hour:"numeric",minute:"2-digit",hour12:true}).format(d).toLowerCase();
}
// The three age groups, in ascending order. Each spans a half-open month band so
// a [12,36] event maps to toddler only, not to both neighbours.
const AGE_GROUPS = ["baby","toddler","preschool"];
const AGE_BANDS  = { baby:[0,12], toddler:[12,36], preschool:[36,60] };
// Map a legacy numeric [min,max] month span to the group ids it overlaps. Used as
// a back-compat fallback for old data files that predate the `ages` array.
function spanToGroups(min,max){
  const lo=min??0, hi=max??60;
  return AGE_GROUPS.filter(g=>{ const [a,b]=AGE_BANDS[g]; return lo<b && hi>a; });
}
// Human label for an event's groups: their names in order, or "All ages" when all three.
function agesLabel(groups){
  const g=(groups||[]).filter(x=>AGE_BANDS[x]);
  if(g.length>=AGE_GROUPS.length) return t("ages.all");
  return AGE_GROUPS.filter(x=>g.includes(x)).map(x=>t("age."+x)).join(" · ");
}
// Human name for a language code, falling back to the generic "Other" for any
// code we don't have a dedicated string for.
function langName(code){
  const k = "lang."+code, s = t(k);
  return s===k ? t("lang.other") : s;
}
function langTags(arr){
  if(arr.length>1){
    const codes = arr.map(c=>c.toUpperCase());
    // Named languages get a compact "Bilingual EN·DE" badge; if one side is the
    // generic "other" bucket, drop to a plain "Bilingual" rather than "EN·OTHER".
    return codes.includes("OTHER") ? [t("badge.bilingual")]
                                   : [t("badge.bilingualN",{codes:codes.join("·")})];
  }
  return arr.map(langName);
}
function pad(n){ return String(n).padStart(2,"0"); }
function dateKey(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
// Parse "yyyy-mm-dd" as a LOCAL date (Date("yyyy-mm-dd") would parse as UTC).
function parseDate(s){ const [y,m,d]=String(s).split("-").map(Number); return new Date(y, m-1, d); }

// ---------- DATA LOADING --------------------------------------------------
// Load a data file by adding a <script> tag. Unlike fetch(), this works over
// file://. The script populates window.STORYTIME as a side effect.
function loadScript(path){
  return new Promise((resolve,reject)=>{
    const s=document.createElement("script");
    s.src=path; s.async=false;
    s.onload=()=>resolve(path);
    s.onerror=()=>reject(new Error(`Couldn't load ${path}`));
    document.head.appendChild(s);
  });
}

// Read the manifest, the library metadata, then every month file it lists,
// and flatten them into ALL[]. A single bad month file is skipped, not fatal.
async function loadData(){
  const S = window.STORYTIME;

  await loadScript(`${DATA_DIR}/manifest.js`);
  const manifest = S.manifest || {};
  const months   = manifest.months || [];
  const libsFile = manifest.libraries || "libraries.js";

  await loadScript(`${DATA_DIR}/${libsFile}`);
  LIBS = S.libraries || [];
  LIBS.forEach((l,i)=>{ if(!l.color) l.color = PALETTE[i % PALETTE.length]; });
  LIB = Object.fromEntries(LIBS.map(l=>[l.id,l]));

  const results = await Promise.allSettled(
    months.map(mo => loadScript(`${DATA_DIR}/${mo}.js`))
  );
  const raw = [];
  months.forEach((mo,i)=>{
    if(results[i].status !== "fulfilled"){ console.warn("Skipped month", mo, results[i].reason); return; }
    const doc  = (S.months||{})[mo];
    const list = doc ? (doc.events||[]) : [];
    for(const ev of list) raw.push(ev);
  });

  ALL = raw.map(normalize).filter(Boolean).sort((a,b)=> a.start - b.start);
}

// Turn a raw JSON event into the internal shape the renderers expect. The .tp
// sub-object mirrors the old "template" fields so the render code is unchanged.
function normalize(ev){
  const lib = LIB[ev.lib];
  if(!lib) return null;                       // unknown library id -> skip
  const date = parseDate(ev.date);
  if(isNaN(date)) return null;                // bad date -> skip
  const time = ev.time || "10:00";
  const [h,m] = time.split(":").map(Number);
  const dur = ev.dur ?? 30;
  const start = new Date(date); start.setHours(h, m, 0, 0);
  const finish = new Date(start.getTime() + dur*60000);
  // Prefer the scraped `ages` array; fall back to a legacy [ageMin,ageMax] span
  // for old-schema files. Events tagged no group are shown as "all ages".
  const ages = (ev.ages && ev.ages.length) ? ev.ages.filter(g=>AGE_BANDS[g])
             : spanToGroups(ev.ageMin, ev.ageMax);
  const tp = {
    name: ev.name, t: time, dur,
    ages, ageText: ev.ageText || "",
    lang: (ev.lang && ev.lang.length) ? ev.lang : ["en"],
    eventId: ev.eventId || "",     // deep-links to the exact event when known
    url: ev.url || "",             // optional explicit override
    note: ev.note || "",
    dow: date.getDay()
  };
  return { tp, lib, date, start, finish, key: dateKey(date) };
}

// The public link for an event. Prefer an explicit url; else deep-link by
// eventId into the correct platform for that library's system; else fall back
// to the system's events calendar so the link always lands somewhere real.
function eventUrl(e){
  const t=e.tp, l=e.lib;
  if(t.url) return t.url;
  if(t.eventId){
    return l.system==="county"
      ? `https://sdcl.bibliocommons.com/events/${encodeURIComponent(t.eventId)}`
      : `https://sandiego.events.mylibrary.digital/event?id=${encodeURIComponent(t.eventId)}`;
  }
  return l.events || l.web || "#";
}

// A map deep-link for a library's location. Apple users (iOS/macOS) get Apple
// Maps; everyone else (incl. Android) gets Google Maps. Coordinates keep the
// pin exact; the name labels it.
function isAppleDevice(){
  return /iPhone|iPad|iPod|Macintosh|Mac OS X/i.test(navigator.userAgent||"");
}
function mapsUrl(l){
  const q=encodeURIComponent(l.name);
  return isAppleDevice()
    ? `https://maps.apple.com/?ll=${l.lat},${l.lng}&q=${q}`
    : `https://www.google.com/maps/search/?api=1&query=${l.lat},${l.lng}`;
}

// ---------- FILTER --------------------------------------------------------
function applyFilters(all){
  const langSel = Object.entries(state.langs).filter(([,v])=>v).map(([k])=>k);
  const today = new Date(); today.setHours(0,0,0,0);
  const end = new Date(today); end.setDate(end.getDate()+state.weeks*7); end.setHours(23,59,59,999);
  return all.filter(e=>{
    // rolling window: today through the next N weeks
    if(e.date < today || e.date > end) return false;
    if(libDist(e.lib) > state.radius+0.05) return false;
    // language: event langs intersect selection (en/es explicit, else 'other')
    const evLangs = e.tp.lang.map(x=> (x==="en"||x==="es")?x:"other");
    if(!evLangs.some(x=>langSel.includes(x))) return false;
    // age group: event passes if any of its groups is selected
    if(!e.tp.ages.some(g=>state.ages[g])) return false;
    // day of week: Sun–Sat toggles; a day passes only if its chip is selected
    if(!state.dows[e.date.getDay()]) return false;
    // time of day: am / pm
    const slot = e.start.getHours() < 12 ? "am" : "pm";
    if(!state.times[slot]) return false;
    return true;
  }).map(e=>{
    e.dist = libDist(e.lib);
    return e;
  });
}

function gcalUrl(e){
  const f=d=>`${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
  const note=e.tp.note?` ${e.tp.note}`:"";
  const details=t("gcal.details",{name:e.tp.name, lib:e.lib.name, note,
    label:agesLabel(e.tp.ages), url:eventUrl(e)});
  // Build manually so the slash between start/end times stays a literal "/"
  // (URLSearchParams encodes it to %2F, which Google's TEMPLATE parser rejects).
  const q=[
    "action=TEMPLATE",
    "text="+encodeURIComponent(t("gcal.text",{name:e.tp.name, lib:e.lib.name})),
    "dates="+f(e.start)+"/"+f(e.finish),
    "location="+encodeURIComponent(e.lib.addr),
    "details="+encodeURIComponent(details),
    "ctz=America/Los_Angeles"
  ].join("&");
  return "https://calendar.google.com/calendar/render?"+q;
}

// ---------- RENDER --------------------------------------------------------
const app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// Distance pill (pin + miles), shared by all three views. The pin takes the library color.
function distPill(mi,col){
  return `<span class="distpill"><span class="pin" style="color:${col}">${ICON.pin}</span>${esc(t("unit.mi",{n:mi.toFixed(1)}))}</span>`;
}
// A library-page link (or plain text when the library has no linkable page).
function libLink(l,cls){
  const url=l.web||l.events;
  const c=cls?` class="${cls}"`:"";
  return url
    ? `<a${c} href="${esc(url)}" target="_blank" rel="noopener">${esc(l.name)}</a>`
    : `<span${c}>${esc(l.name)}</span>`;
}
// Language badge(s) for an event. English-only is hidden as the near-universal default;
// Spanish, Mandarin and bilingual events still get a pill. `cls` picks the pill class so
// each view keeps its own (schedule/location use "tag", by-date uses "btag").
function langPills(langs,cls){
  const showLang = langs.length>1 || (langs[0] && langs[0]!=="en");
  if(!showLang) return "";
  const c = cls || "tag";
  return langTags(langs).map(tag=>`<span class="${c} lang">${esc(tag)}</span>`).join("");
}

function evCard(e){
  const col=e.lib.color;
  // Time takes the library's identity color, darkened toward the ink so it stays legible on white.
  const tcol=`color-mix(in srgb, ${col} 68%, var(--ink))`;
  // Language + age badges, same pill treatment as the By-date view (lang first, then ages).
  const pills = langPills(e.tp.lang) + `<span class="tag age">${esc(agesLabel(e.tp.ages))}</span>`;
  return `<article class="ev" style="border-left-color:${col}">
    <div class="time" style="color:${tcol}">${fmtTime(e.tp.t)}<small>${esc(t("unit.min",{n:e.tp.dur}))}</small></div>
    <div class="body">
      <h3><a href="${esc(eventUrl(e))}" target="_blank" rel="noopener">${esc(e.tp.name)}</a></h3>
      <div class="meta">
        <div class="metatop">${libLink(e.lib,"loc")}${distPill(e.dist,col)}</div>
        <div class="metapills">${pills}</div>
      </div>
    </div>
    <a class="calbtn" href="${gcalUrl(e)}" target="_blank" rel="noopener" title="${esc(t("btn.gcal"))}" aria-label="${esc(t("btn.gcal"))}">${ICON.cal}</a>
  </article>`;
}

function renderSchedule(evs){
  if(!evs.length) return emptyState();
  const byDay={};
  evs.forEach(e=>{ (byDay[e.key]=byDay[e.key]||[]).push(e); });
  const keys=Object.keys(byDay).sort();
  let h="";
  for(const k of keys){
    // within a day: earliest time first, then closest as the tiebreaker
    const list=byDay[k].sort((a,b)=> (a.start-b.start) || (a.dist-b.dist));
    const d=list[0].date;
    h+=`<section class="dategroup">
      <div class="datehead">
        <h2><span class="dow">${esc(wdLong(d))}</span> ${esc(moShort(d))} ${d.getDate()}</h2>
        <span class="cnt">${esc(t("schedule.count",{n:list.length}))}</span>
      </div>
      ${list.map(evCard).join("")}
    </section>`;
  }
  return h;
}

// One dated event occurrence in the By-location view.
function schedRow(e){
  return `<div class="schedrow">
    <span class="d">${esc(wdShort(e.date))} ${esc(moShort(e.date))} ${e.date.getDate()} · ${fmtTime(e.tp.t)}</span>
    <span class="n"><a href="${esc(eventUrl(e))}" target="_blank" rel="noopener">${esc(e.tp.name)}</a><div class="sub">${langPills(e.tp.lang)}<span class="tag age">${esc(agesLabel(e.tp.ages))}</span></div></span>
    <a class="calbtn" href="${gcalUrl(e)}" target="_blank" rel="noopener" title="${esc(t("btn.gcal"))}" aria-label="${esc(t("btn.gcal"))}">${ICON.cal}</a>
  </div>`;
}
// Inline stroke icons for the By-location header (currentColor, sized in em via .ic).
const ICON={
  ext:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/><path d="M11 13l9-9M15 4h5v5"/></svg>',
  pin:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11a3 3 0 1 0 6 0 3 3 0 0 0-6 0"/><path d="M17.657 16.657 13.414 20.9a2 2 0 0 1-2.827 0l-4.243-4.243a8 8 0 1 1 11.313 0z"/></svg>',
  map:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></svg>',
  phone:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L16 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>',
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/><path d="M4 10h16M8 3v4M16 3v4M12 13v4M10 15h4"/></svg>'
};
function renderLocation(evs){
  // group by lib, only libs that have any matching event (plus always-note the closed home library if in radius)
  const byLib={};
  evs.forEach(e=>{ (byLib[e.lib.id]=byLib[e.lib.id]||[]).push(e); });
  // ordering: nearest library first, with each library's soonest upcoming event
  // as the tiebreaker. Libraries with no events in view (shown only for a l.note)
  // still sort by distance; their nextStart is Infinity but only breaks ties.
  const nextStart = id => { const r=byLib[id]; return (r&&r.length) ? Math.min(...r.map(e=>+e.start)) : Infinity; };
  const libIds=LIBS.filter(l=>libDist(l)<=state.radius+0.05)
                   .sort((a,b)=> (libDist(a)-libDist(b)) || (nextStart(a.id)-nextStart(b.id))).map(l=>l.id);
  let h="";
  let any=false;
  for(const id of libIds){
    const l=LIB[id]; const col=l.color;
    // every matching occurrence, in chronological order
    const rows=(byLib[id]||[]).sort((a,b)=> a.start-b.start);
    if(!rows.length && !l.note) continue;
    any=true;
    // Name links to the library page; a trailing ↗ icon signals that (option A).
    const nameHtml = l.web
      ? `<a href="${esc(l.web)}" target="_blank" rel="noopener"><span class="name">${esc(l.name)}</span></a>`
      : `<span class="name">${esc(l.name)}</span>`;
    const street = esc(l.addr.split(",")[0]);
    h+=`<section class="loccard" style="border-left-color:${col}">
      <div class="lhead">
        <h2><span class="dot" style="background:${col}"></span>${nameHtml}</h2>
        ${distPill(libDist(l),col)}
      </div>
      <p class="meta">
        <a class="maplink" href="${esc(mapsUrl(l))}" target="_blank" rel="noopener" title="${esc(t("loc.map",{name:l.name}))}">${ICON.map}${street}</a>
        ${l.phone?`<a href="tel:${l.phone.replace(/[^0-9]/g,'')}">${ICON.phone}${esc(t("loc.call"))}</a>`:""}
        <span class="systag">${esc(l.sys)}</span>
      </p>
      ${l.note?`<div class="note">⚠ ${esc(l.note)}</div>`:""}
      ${rows.slice(0,2).map(schedRow).join("")}
      ${rows.length>2 ? `<details class="morerows">
          <summary><span class="more">${esc(t("loc.showMore",{n:rows.length-2}))}</span><span class="less">${esc(t("loc.showLess"))}</span></summary>
          ${rows.slice(2).map(schedRow).join("")}
        </details>` : ""}
    </section>`;
  }
  return any? h : emptyState();
}

function renderDate(evs){
  if(!evs.length) return emptyState();
  const byDay={};
  evs.forEach(e=>{ (byDay[e.key]=byDay[e.key]||[]).push(e); });
  const keys=Object.keys(byDay).sort();
  if(!state.selDay || !byDay[state.selDay]) state.selDay=keys[0];
  // day nav
  let nav=`<div class="daynav">`;
  for(const k of keys){
    const list=byDay[k]; const d=list[0].date;
    nav+=`<div class="daychip ${k===state.selDay?"on":""}" data-day="${k}">
      <div class="mo">${esc(moShort(d))}</div>
      <div class="dw" title="${esc(wdLong(d))}">${esc(wdTwo(d))}</div>
      <div class="dn">${d.getDate()}</div>
      <div class="cc">${esc(t("date.evShort",{n:list.length}))}</div>
    </div>`;
  }
  nav+=`</div>`;
  // blocks
  // within the selected day: earliest time first, then closest as the tiebreaker
  const day=byDay[state.selDay].sort((a,b)=> (a.start-b.start) || (a.dist-b.dist));
  const d0=day[0].date;
  let head=`<div class="datesticky">
      <h2>${esc(wdLong(d0))}, ${esc(moShort(d0))} ${d0.getDate()}</h2>
      <p class="dcount">${esc(t("date.count",{n:day.length}))}</p>
    </div>`;
  let blocks=`<div class="dayblocks">`+day.map(e=>{
    const col=e.lib.color;
    return `<div class="block" style="--bcol:${col}">
      <div class="bt">${fmtTime(e.tp.t)} <small>· ${esc(t("unit.min",{n:e.tp.dur}))}</small></div>
      <h3><a href="${esc(eventUrl(e))}" target="_blank" rel="noopener">${esc(e.tp.name)}</a></h3>
      <div class="bl"><span class="dot"></span>${libLink(e.lib)}${distPill(e.dist,col)}</div>
      <div class="bmeta">
        ${langPills(e.tp.lang,"btag")}
        <span class="btag age">${esc(agesLabel(e.tp.ages))}</span>
      </div>
      <a class="calbtn" href="${gcalUrl(e)}" target="_blank" rel="noopener" title="${esc(t("btn.gcal"))}" aria-label="${esc(t("btn.gcal"))}">${ICON.cal}</a>
    </div>`;
  }).join("")+`</div>`;
  return nav+head+blocks;
}

function loadingState(){
  const msg = locating ? t("loading.locating") : t("loading.data");
  return `<div class="empty"><div class="spinner" role="status" aria-label="${esc(t("a11y.loading"))}"></div>
    <h2>${esc(msg)}</h2></div>`;
}
function errorState(err){
  const msg = esc(String(err && err.message || err));
  return `<div class="empty">
    <h2>${esc(t("error.title"))}</h2>
    <p>${msg}</p>
    <p style="margin-top:14px">${t("error.body",{dir:esc(DATA_DIR)})}</p>
  </div>`;
}
function emptyState(){
  return `<div class="empty">
    <h2>${esc(t("empty.title"))}</h2>
    <p>${esc(t("empty.body"))}<br>
    ${esc(t("empty.reno"))}</p>
  </div>`;
}

function render(){
  const summaryEl=document.getElementById("summary");
  if(loadState==="error"){ app.innerHTML=errorState(loadError); summaryEl.textContent=""; return; }
  if(loadState==="loading" || locating){ app.innerHTML=loadingState(); summaryEl.textContent=""; return; }

  const evs=applyFilters(ALL);
  const libs=new Set(evs.map(e=>e.lib.id)).size;
  summaryEl.innerHTML=
    t("summary.line",{n:evs.length, libs:libs, weeks:state.weeks});
  const fsum=document.getElementById("fsum");
  if(fsum) fsum.textContent=t("fsum",{n:evs.length});

  if(state.view==="schedule") app.innerHTML=renderSchedule(evs);
  else if(state.view==="location") app.innerHTML=renderLocation(evs);
  else app.innerHTML=renderDate(evs);

  if(state.view==="date"){
    app.querySelectorAll(".daychip").forEach(c=>c.addEventListener("click",()=>{
      state.selDay=c.dataset.day; render();
    }));
  }
}

// ---------- CONTROLS WIRING ----------------------------------------------
// Paint a chip. `c` is either {bg,fg} for a color-carrying dimension (age/language) or
// null for a neutral dimension (day/time), whose selected state is the ink/paper swap.
function paintChip(el,c){
  const on=el.querySelector("input").checked; el.classList.toggle("on",on);
  const dot=el.querySelector(".dot");
  if(c){
    el.classList.remove("neu");
    if(dot) dot.style.background=c.fg;                 // crisp family dot when unselected
    el.style.background=on?c.bg:""; el.style.color=on?c.fg:""; el.style.borderColor=on?"transparent":"";
  }else{
    el.classList.add("neu");
    if(dot) dot.style.background="";
    el.style.background=""; el.style.color=""; el.style.borderColor="";  // CSS .chk.on.neu drives it
  }
}
function syncColors(){
  // Scheme 1: age dimension = amber shades (light→deep), matches the card's amber ages pill.
  const age={baby:{bg:"#FAEEDA",fg:"#854F0B"},toddler:{bg:"#FAC775",fg:"#633806"},preschool:{bg:"#BA7517",fg:"#fff"}};
  document.querySelectorAll("#ageChecks .chk").forEach(el=>{
    el.querySelector("input").checked=!!state.ages[el.dataset.age];
    paintChip(el,age[el.dataset.age]);
  });
  // Language dimension = teal shades, matches the card's teal language pill.
  const lang={en:{bg:"#E1F5EE",fg:"#0F6E56"},es:{bg:"#9FE1CB",fg:"#0F6E56"},other:{bg:"#0F6E56",fg:"#fff"}};
  document.querySelectorAll("#langChecks .chk").forEach(el=>{
    el.querySelector("input").checked=!!state.langs[el.dataset.lang];
    paintChip(el,lang[el.dataset.lang]);
  });
  // Day + time are neutral (no category color) — selected state is the ink/paper swap.
  document.querySelectorAll("#dowChecks .chk").forEach(el=>{
    el.querySelector("input").checked=!!state.dows[+el.dataset.dow];
    paintChip(el,null);
  });
  updateDowBtn();
  document.querySelectorAll("#timeChecks .chk").forEach(el=>{
    el.querySelector("input").checked=!!state.times[el.dataset.time];
    paintChip(el,null);
  });
}
// Keep the sticky view-tabs / date headers pinned right below the (pinned) filter panel,
// whose height changes when the drawer expands/collapses.
function syncStickyHeights(){
  const panel=document.getElementById("panel"), bar=document.querySelector(".bar");
  if(!panel||!bar) return;
  const ph=panel.offsetHeight;
  const root=document.documentElement.style;
  root.setProperty("--panelH", ph+"px");
  root.setProperty("--headH", (ph + bar.offsetHeight)+"px");
}
// Mobile filter drawer: toggle the panel open/closed (CSS hides controls otherwise).
// It also auto-collapses (mobile only) once you scroll past the header and re-opens
// back at the top, so the pinned filters don't hog the screen while browsing. A
// hysteresis band between the two thresholds leaves a manual toggle untouched.
(function(){
  const panel=document.getElementById("panel"), btn=document.getElementById("filterToggle");
  const header=document.querySelector("header");
  const mq=window.matchMedia("(max-width:640px)");
  function setOpen(open){
    if(open===panel.classList.contains("open")) return;
    panel.classList.toggle("open",open);
    btn.setAttribute("aria-expanded",open?"true":"false");
    syncStickyHeights();
  }
  btn.addEventListener("click",()=>setOpen(!panel.classList.contains("open")));

  // Collapse once the header has roughly scrolled away; re-open only right at the top.
  let collapseAt=140, ticking=false;
  function measure(){ collapseAt=Math.max(80,(header?header.offsetHeight:140)-24); }
  function onScroll(){
    if(ticking) return; ticking=true;
    requestAnimationFrame(()=>{
      ticking=false;
      if(!mq.matches) return;                 // desktop: controls always shown
      const y=window.scrollY||window.pageYOffset||0;
      if(y<4){ setOpen(true); return; }       // at the very top: filters always shown
      // Collapsing frees the controls' height. On a short page (e.g. one event in the
      // By-date view) that snaps scrollY back to the top, which re-opens the drawer — a
      // flip-flop that swallows the scroll gesture. Only auto-collapse when the page is
      // still scrolled past the collapse point after that height is removed.
      const controls=document.getElementById("controls");
      const freed=(panel.classList.contains("open") && controls) ? controls.offsetHeight : 0;
      const maxAfterCollapse=document.documentElement.scrollHeight - freed - window.innerHeight;
      if(y>collapseAt && maxAfterCollapse>collapseAt) setOpen(false);
    });
  }
  measure();
  window.addEventListener("scroll", onScroll, {passive:true});
  window.addEventListener("resize", ()=>{ measure(); syncStickyHeights(); });
})();
document.getElementById("zip").addEventListener("input",e=>{
  const v=e.target.value.trim();
  state.zip = /^\d{5}$/.test(v)? v : SD_CENTROID_ZIP;
  if(/^\d{5}$/.test(v)) render();
});
document.getElementById("zip").addEventListener("blur",render);
function bindRange(id,key,fmt){
  const el=document.getElementById(id), out=document.getElementById(id+"V");
  el.addEventListener("input",()=>{ state[key]=+el.value; out.textContent=fmt(el.value); render(); });
  out.textContent=fmt(el.value);
}
bindRange("radius","radius",v=>`${v} mi`);
document.querySelectorAll("#ageChecks .chk").forEach(el=>{
  el.querySelector("input").addEventListener("change",()=>{
    state.ages[el.dataset.age]=el.querySelector("input").checked; syncColors(); render();
  });
});
document.querySelectorAll("#langChecks .chk").forEach(el=>{
  el.querySelector("input").addEventListener("change",()=>{
    state.langs[el.dataset.lang]=el.querySelector("input").checked; syncColors(); render();
  });
});
document.querySelectorAll("#dowChecks .chk").forEach(el=>{
  el.querySelector("input").addEventListener("change",()=>{
    state.dows[+el.dataset.dow]=el.querySelector("input").checked; syncColors(); render();
  });
});
// Set the day selection to an exact set of weekdays (replaces whatever was picked).
function setDows(days){
  for(let d=0; d<7; d++) state.dows[d]=days.includes(d);
  syncColors(); render();
}
// Adaptive header link: "Select all" while nothing is picked, "Clear" once any day is on.
// Called from syncColors (state changes) and setLang (language switch).
function updateDowBtn(){
  const btn=document.getElementById("dowAll"); if(!btn) return;
  const none=!Object.values(state.dows).some(Boolean);
  btn.dataset.act=none?"all":"clear";
  btn.textContent=t(none?"dow.selectAll":"dow.clear");
}
document.getElementById("dowAll").addEventListener("click",e=>
  setDows(e.currentTarget.dataset.act==="clear" ? [] : [0,1,2,3,4,5,6]));
document.querySelectorAll("#timeChecks .chk").forEach(el=>{
  el.querySelector("input").addEventListener("change",()=>{
    state.times[el.dataset.time]=el.querySelector("input").checked; syncColors(); render();
  });
});
document.querySelectorAll("#tabs button").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll("#tabs button").forEach(x=>x.classList.remove("on"));
  b.classList.add("on"); state.view=b.dataset.view; render();
}));

// Footer is localized and painted by applyStaticI18n() → footerHtml() (called on
// load and on every language switch), so it isn't set here.

// Back-to-top button: appears after scrolling down, returns to the top on click.
(function(){
  const btn=document.getElementById("toTop");
  const smooth=!window.matchMedia("(prefers-reduced-motion:reduce)").matches;
  let ticking=false;
  function sync(){ btn.classList.toggle("show", window.scrollY>400); }
  window.addEventListener("scroll",()=>{
    if(ticking) return; ticking=true;
    requestAnimationFrame(()=>{ sync(); ticking=false; });
  },{passive:true});
  btn.addEventListener("click",()=>window.scrollTo({top:0, behavior:smooth?"smooth":"auto"}));
  sync();
})();

// ---------- INIT ----------------------------------------------------------
syncColors();
setLang(initialLang());         // language: ?lang → localStorage → navigator → en. Sets <html lang>,
                                // the toggle, static strings + dow chips, then render() + syncStickyHeights().
document.querySelectorAll(".langtoggle button").forEach(b=>
  b.addEventListener("click",()=>setLang(b.dataset.setlang)));
setFiltersEnabled(false);       // filters stay locked until locating resolves
initLocation();                 // async: recenters on the user's location if allowed
loadData().then(()=>{
  loadState="ready";
  render();
  syncStickyHeights();          // panel height is settled; re-pin the view bar / date heads
}).catch(err=>{
  loadState="error"; loadError=err;
  console.error("Data load failed:", err);
  render();
});
</script>
